<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f19" />
    <meta name="description" content="Horvat Innovative Labs – Immersive Training and Digital Experiences with Virtual Reality. VR Classroom4You platform for education and professional training." />
    <title>Horvat Innovative Labs | Immersive VR Training & Digital Experiences</title>
    <link rel="canonical" href="https://horvatlabs.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Horvat Innovative Labs | Immersive VR Training & Digital Experiences" />
    <meta property="og:description" content="VR Classroom4You – Immersive training and digital experiences for education and professional training. Virtual Reality solutions for organizations and institutions." />
    <meta property="og:url" content="https://horvatlabs.com/" />
    <meta property="og:locale" content="en" />

    <!-- Performance: font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

    <!-- Structured data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Horvat Innovative Labs",
      "url": "https://horvatlabs.com",
      "description": "Innovation-driven initiative dedicated to immersive technologies: VR, AR, and MR. VR Classroom4You platform for education and professional training.",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection (same name/fields as React form) -->
    <form name="demo-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

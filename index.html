<!DOCTYPE html>
<html lang="hr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply saved theme/language before first paint (light + Croatian by default)
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l === "en" || l === "hr") document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <meta name="description" content="Horvat Innovative Labs – imerzivna obuka i digitalna iskustva u virtualnoj stvarnosti. Platforma VR Classroom4You za obrazovanje i stručnu obuku." />
    <title>Horvat Innovative Labs | Imerzivna VR obuka i digitalna iskustva</title>
    <link rel="canonical" href="https://horvatinnovativelabs.com/" />
    <link rel="icon" type="image/png" href="/svg.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Horvat Innovative Labs | Imerzivna VR obuka i digitalna iskustva" />
    <meta property="og:description" content="VR Classroom4You – imerzivna obuka i digitalna iskustva za obrazovanje i stručnu obuku. Rješenja virtualne stvarnosti za organizacije i ustanove." />
    <meta property="og:url" content="https://horvatinnovativelabs.com/" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://horvatinnovativelabs.com/Oculus3.jpg" />

    <!-- Performance: font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

    <!-- Structured data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Horvat Innovative Labs",
      "url": "https://horvatinnovativelabs.com",
      "description": "Innovation-driven initiative dedicated to immersive technologies: VR, AR, and MR. VR Classroom4You platform for education and professional training.",
      "email": "info@horvatinnovativelabs.com",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection (same name/fields as React form) -->
    <form name="demo-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

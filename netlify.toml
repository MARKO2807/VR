# Netlify build and deploy settings for Horvat VR Landing
[build]
  command = "npm run build"
  publish = "dist"

# So the form handler is deployed (required for "Request a Demo" to work)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
